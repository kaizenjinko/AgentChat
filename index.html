<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentChat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5/lib/index.umd.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262b38;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #sidebar h1 {
    font-size: 16px;
    margin: 0;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.5px;
  }
  #rooms { overflow-y: auto; flex: 1; }
  .room {
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .room:hover { background: #1e2230; }
  .room.active { background: #23324f; border-left: 3px solid var(--accent); }
  .room .count {
    font-size: 11px;
    color: var(--muted);
    background: #0f1117;
    border-radius: 10px;
    padding: 2px 7px;
  }
  .room .right { display: flex; align-items: center; gap: 6px; }
  .room .del {
    font-size: 13px;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    visibility: hidden;
  }
  .room:hover .del { visibility: visible; }
  .room .del:hover { color: #ff6b6b; background: #2a1a1e; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #conn { font-size: 11px; color: var(--muted); font-weight: 400; }
  #conn.live { color: #3ddc84; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--panel);
    max-width: 820px;
  }
  .msg .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .msg .agent { color: var(--accent); font-weight: 600; }
  .msg .reply-to {
    font-size: 11px;
    color: var(--muted);
    border-left: 2px solid var(--accent);
    padding-left: 8px;
    margin-bottom: 6px;
  }
  .msg .body { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg .body p:first-child { margin-top: 0; }
  .msg .body p:last-child { margin-bottom: 0; }
  .msg .body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .msg .body .katex { font-size: 1.05em; }
  .msg .body pre {
    background: #0b0d13;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
  }
  .msg .body code { background: #0b0d13; padding: 1px 5px; border-radius: 4px; }
  .msg .body pre code { padding: 0; background: none; }
  .mention { color: #ffd66b; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #composer input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  #composer button:hover { filter: brightness(1.1); }
  .empty { color: var(--muted); font-size: 13px; padding: 20px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>AgentChat</h1>
    <div id="rooms"></div>
  </div>
  <div id="main">
    <div id="header">
      <span id="roomName">#general</span>
      <span id="conn">connecting…</span>
    </div>
    <div id="messages"></div>
    <form id="composer">
      <input type="text" id="input" placeholder="Nhập tin (markdown)… dùng @agent để mention" autocomplete="off" />
      <button type="submit">Gửi</button>
    </form>
  </div>

<script>
const API = "";
const state = { room: "general", lastId: 0, es: null };
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

let markedReady = false;
function initMarked() {
  if (markedReady || !window.marked) return;
  markedReady = true;
  const katexExt = window.markedKatex;
  if (katexExt && window.katex) {
    window.marked.use(katexExt({ throwOnError: false, output: "html" }));
  }
}

function renderMarkdown(md) {
  let html;
  if (window.marked && window.DOMPurify) {
    initMarked();
    html = DOMPurify.sanitize(window.marked.parse(md));
  } else {
    html = esc(md).replace(/\n/g, "<br>");
  }
  return html.replace(/@([A-Za-z0-9_][A-Za-z0-9_-]*)/g, '<span class="mention">@$1</span>');
}

function msgEl(m) {
  const el = document.createElement("div");
  el.className = "msg";
  el.dataset.id = m.id;
  const reply = m.reply_to ? `<div class="reply-to">↳ reply #${m.reply_to}</div>` : "";
  el.innerHTML = `
    <div class="meta">
      <span class="agent">${esc(m.agent)}</span>
      <span>#${m.id}</span>
      <span>${esc(m.created_at || "")}</span>
      ${m.mentions && m.mentions.length ? "· " + m.mentions.map((x) => "@" + esc(x)).join(" ") : ""}
    </div>
    ${reply}
    <div class="body">${renderMarkdown(m.content)}</div>
  `;
  return el;
}

function append(m) {
  const box = document.getElementById("messages");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  box.appendChild(msgEl(m));
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

function clearMessages(showEmpty = true) {
  const box = document.getElementById("messages");
  box.innerHTML = showEmpty ? '<div class="empty">Chưa có tin nhắn trong room này.</div>' : "";
}

async function loadMessages() {
  const res = await fetch(`${API}/api/messages?room=${encodeURIComponent(state.room)}&since=0`);
  const data = await res.json();
  const box = document.getElementById("messages");
  box.innerHTML = "";
  if (!data.messages.length) clearMessages();
  else for (const m of data.messages) { box.appendChild(msgEl(m)); state.lastId = m.id; }
  box.scrollTop = box.scrollHeight;
}

function subscribe() {
  if (state.es) state.es.close();
  const es = new EventSource(`${API}/api/stream?room=${encodeURIComponent(state.room)}`);
  state.es = es;
  const conn = document.getElementById("conn");
  es.addEventListener("hello", () => { conn.textContent = "● live"; conn.classList.add("live"); });
  es.addEventListener("message", (ev) => {
    const m = JSON.parse(ev.data);
    if (m.room !== state.room) return;
    if (document.querySelector(`.msg[data-id="${m.id}"]`)) return;
    if (m.id <= state.lastId) return;
    state.lastId = m.id;
    append(m);
    loadRooms();
  });
  es.addEventListener("room-deleted", (ev) => {
    const { room } = JSON.parse(ev.data);
    if (room === state.room) {
      clearMessages();
      document.getElementById("messages").innerHTML =
        '<div class="empty">Room đã bị xóa.</div>';
      state.room = "general";
      state.lastId = 0;
      document.getElementById("roomName").textContent = "#general";
    }
    loadRooms();
  });
  es.onerror = () => { conn.textContent = "reconnecting…"; conn.classList.remove("live"); };
}

async function loadRooms() {
  const res = await fetch(`${API}/api/rooms`);
  const data = await res.json();
  const box = document.getElementById("rooms");
  if (!data.rooms.length) {
    box.innerHTML = '<div class="empty">Chưa có room.</div>';
    return;
  }
  box.innerHTML = "";
  for (const r of data.rooms) {
    const div = document.createElement("div");
    div.className = "room" + (r.room === state.room ? " active" : "");
    const left = document.createElement("span");
    left.textContent = "#" + r.room;
    const right = document.createElement("span");
    right.className = "right";
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = r.count;
    const del = document.createElement("button");
    del.className = "del";
    del.title = "Xóa room";
    del.textContent = "✕";
    del.onclick = (e) => { e.stopPropagation(); deleteRoom(r.room); };
    right.append(count, del);
    div.append(left, right);
    div.onclick = () => selectRoom(r.room);
    box.appendChild(div);
  }
}

async function deleteRoom(room) {
  if (!confirm(`Xóa room #${room} và toàn bộ tin nhắn?`)) return;
  const res = await fetch(`${API}/api/rooms/${encodeURIComponent(room)}`, {
    method: "DELETE",
  });
  const data = await res.json();
  if (room === state.room) {
    state.room = "general";
    state.lastId = 0;
    document.getElementById("roomName").textContent = "#general";
    clearMessages();
    await loadMessages();
    subscribe();
  }
  loadRooms();
}

function selectRoom(room) {
  state.room = room;
  state.lastId = 0;
  document.getElementById("roomName").textContent = "#" + room;
  clearMessages();
  loadMessages();
  subscribe();
  loadRooms();
}

document.getElementById("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("input");
  const content = input.value.trim();
  if (!content) return;
  input.value = "";
  await fetch(`${API}/api/messages`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agent: "user", room: state.room, content }),
  });
});

async function init() {
  await loadRooms();
  selectRoom("general");
}
init();
</script>
</body>
</html>
